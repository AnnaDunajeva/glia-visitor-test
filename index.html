    <script crossorigin="*" src="//api.beta.salemove.com/salemove_integration.js"></script>
    <script>
      function showContainerRight() {
         const container = document.createElement('div')
         container.setAttribute("id", "large-container-right-1");
         container.classList.add("visible");
         container.style.position = 'absolute'
         container.style.backgroundColor = 'grey'
         container.style.bottom = '0'
         container.style.right = '0'
         container.style.height = '100%'
         container.style.width = '300px'
         const currentDiv = document.getElementById("large-container-right");
         currentDiv.appendChild(container)
      }
      
      function hideContainerRight() {
        const element = document.getElementById('large-container-right-1');
        if (element) {
           element.classList.add("hidden");
           element.classList.remove("visible");
        }
      }
    </script>
    <script>
    // This function is called when the Turnstile script is loaded and ready to be used.
    // The function name matches the "onload=..." parameter.
    function _turnstileCb() {
        console.debug('_turnstileCb called');
    
        turnstile.render('#myWidget', {
          sitekey: '1x00000000000000000000AA',
          theme: 'light',
        });
    }
    </script>
