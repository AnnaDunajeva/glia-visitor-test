    <script>
      function showContainerRight() {
         const container = document.createElement('div')
         container.setAttribute("id", "large-container-right-1");
         container.classList.add("visible");
         container.style.position = 'absolute'
         container.style.backgroundColor = 'grey'
         container.style.bottom = '0'
         container.style.right = '0'
         container.style.height = '100%'
         container.style.width = '300px'
         const currentDiv = document.getElementById("large-container-right");
         currentDiv.appendChild(container)
      }
      
      function hideContainerRight() {
        const element = document.getElementById('large-container-right-1');
        if (element) {
           element.classList.add("hidden");
           element.classList.remove("visible");
        }
      }
    </script>
    <script>
    // This function is called when the Turnstile script is loaded and ready to be used.
    // The function name matches the "onload=..." parameter.
    function _turnstileCb() {

        });

    <script>
      (function() {
          const HEADER_NAME = 'baggage';
          const HEADER_VALUE = 'test';
          const EXCLUSION_PATTERN = 'visitor_config';
      
          function isExcluded(url) {
              return url.includes(EXCLUSION_PATTERN);
          }
      
          // --- Intercept fetch ---
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
              const url = (typeof input === 'string') ? input : input.url;
      
              if (!isExcluded(url)) {
                  // Ensure headers object exists
                  if (!init) {
                      init = {};
                  }
                  if (!init.headers) {
                      init.headers = {};
                  }
      
                  // Add the custom header
                  // Headers can be an object, an array, or a Headers object.
                  if (init.headers instanceof Headers) {
                      init.headers.set(HEADER_NAME, HEADER_VALUE);
                  } else if (Array.isArray(init.headers)) {
                      init.headers.push([HEADER_NAME, HEADER_VALUE]);
                  } else {
                      init.headers[HEADER_NAME] = HEADER_VALUE;
                  }
                  console.log(`[Interceptor] Added '${HEADER_NAME}' header to fetch request: ${url}`);
              } else {
                  console.log(`[Interceptor] Skipped adding header for excluded fetch request: ${url}`);
              }
      
              // Call the original fetch with the modified arguments
              return originalFetch.apply(this, arguments);
          };
      
          console.log('[Interceptor] Fetch API has been instrumented.');
      
          // --- Intercept XMLHttpRequest ---
          const originalOpen = XMLHttpRequest.prototype.open;
          const originalSend = XMLHttpRequest.prototype.send;
      
          // We store the request URL when open() is called,
          // so we can check it before send() is called.
          const xhrUrlMap = new WeakMap();
      
          XMLHttpRequest.prototype.open = function(method, url) {
              // Store the URL associated with this XHR instance
              xhrUrlMap.set(this, url);
              return originalOpen.apply(this, arguments);
          };
      
          XMLHttpRequest.prototype.send = function() {
              const url = xhrUrlMap.get(this);
      
              if (url && !isExcluded(url)) {
                  // setRequestHeader must be called after open() but before send().
                  this.setRequestHeader(HEADER_NAME, HEADER_VALUE);
                  console.log(`[Interceptor] Added '${HEADER_NAME}' header to XHR request: ${url}`);
              } else if (url) {
                  console.log(`[Interceptor] Skipped adding header for excluded XHR request: ${url}`);
              }
      
              // Call the original send
              return originalSend.apply(this, arguments);
          };
      
          console.log('[Interceptor] XMLHttpRequest has been instrumented.');
      
      })();
    </script>
